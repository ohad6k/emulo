<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger — last 30 days</title>
<style>
  :root{
    --bg:#08090a;
    --ink:#f2f2f0;
    --dim:#8b8d90;
    --faint:#3a3d41;
    --line:#1c1f22;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:900px;overflow:hidden;background:var(--bg)}
  body{
    font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  #stage{position:relative;width:1600px;height:900px}
  canvas#field{position:absolute;inset:0;width:1600px;height:900px}
  .layer{position:absolute;inset:0}

  /* ---------- top rail ---------- */
  .rail{position:absolute;left:64px;right:64px;top:44px;display:flex;justify-content:space-between;align-items:center}
  .rail .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .rail .r{display:flex;align-items:center;gap:22px}
  .live{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--ink);display:block;animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  #clock{font-size:11px;letter-spacing:.18em;color:var(--dim)}

  /* ---------- hero ---------- */
  .hero{position:absolute;left:64px;top:132px}
  h1{
    font-size:146px;line-height:.86;font-weight:600;letter-spacing:-.055em;
    color:var(--ink);
  }
  .period{margin-top:26px;font-size:17px;letter-spacing:.02em;color:var(--dim);display:flex;align-items:center;gap:10px}
  .caret{display:inline-block;width:8px;height:17px;background:var(--ink);opacity:.75;animation:blink 1.15s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:.75}50%,100%{opacity:0}}
  .note{margin-top:14px;font-size:13px;color:var(--faint);letter-spacing:.01em}

  /* ---------- metrics band ---------- */
  .band{position:absolute;left:64px;right:64px;top:500px;height:344px;overflow:hidden}
  .band .rule{position:absolute;left:0;right:0;height:1px;background:var(--line)}
  .band .rule.t{top:0}
  .band .rule.m{top:172px}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:172px 172px}
  .cell{position:relative;padding:30px 30px 0 0}
  .cell:not(:nth-child(4n))::after{content:"";position:absolute;right:24px;top:26px;bottom:26px;width:1px;background:var(--line)}
  .label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:9px}
  .dot{width:5px;height:5px;border-radius:50%;flex:none}
  .dot.on{background:var(--ink);animation:beat 3.2s ease-in-out infinite}
  .dot.off{border:1px solid var(--faint)}
  .val{margin-top:24px;font-size:58px;font-weight:500;letter-spacing:-.035em;line-height:1}
  .val .u{font-size:19px;font-weight:400;letter-spacing:0;color:var(--dim);margin-left:8px}
  .cell.void .label{color:var(--faint)}
  .cell.void .val{color:#4a4d51}
  .tag{margin-top:20px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#4a4d51}
  .dash{margin-top:22px;height:1px;width:130px;
    background-image:repeating-linear-gradient(90deg,#33363a 0 7px,transparent 7px 15px);
    background-size:15px 1px;animation:slide 1.9s linear infinite}
  @keyframes slide{from{background-position:0 0}to{background-position:15px 0}}
  .meter{margin-top:22px;height:1px;width:130px;background:var(--line);position:relative}
  .meter b{position:absolute;left:0;top:0;height:1px;background:var(--ink);width:0;animation:fill 2.2s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes fill{to{width:var(--w)}}

  .sweep{position:absolute;top:0;bottom:0;width:280px;left:-280px;
    background:linear-gradient(90deg,transparent,rgba(242,242,240,.055),transparent);
    animation:sweep 11s linear infinite;pointer-events:none}
  @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1760px)}}

  .up{animation:up 1.1s cubic-bezier(.16,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>

  <div class="layer">
    <div class="rail up" style="animation-delay:.05s">
      <div class="k">Ledger &nbsp;·&nbsp; product telemetry</div>
      <div class="r">
        <div class="live"><i></i> streaming</div>
        <div id="clock">--:--:--</div>
      </div>
    </div>

    <div class="hero">
      <h1 class="up" style="animation-delay:.12s">Ledger</h1>
      <div class="period up" style="animation-delay:.22s">last 30 days <span class="caret"></span></div>
      <div class="note up" style="animation-delay:.3s">4 of 8 metrics instrumented. the rest are not being collected yet.</div>
    </div>

    <div class="band up" style="animation-delay:.38s">
      <div class="sweep"></div>
      <div class="rule t"></div>
      <div class="rule m"></div>
      <div class="grid">

        <div class="cell">
          <div class="label"><span class="dot on"></span>active installs</div>
          <div class="val"><span class="n" data-to="1284" data-dec="0"></span></div>
          <div class="meter"><b style="--w:100%"></b></div>
        </div>

        <div class="cell void">
          <div class="label"><span class="dot off"></span>weekly active users</div>
          <div class="val">--</div>
          <div class="dash"></div>
        </div>

        <div class="cell">
          <div class="label"><span class="dot on"></span>median session</div>
          <div class="val"><span class="n" data-to="12.4" data-dec="1"></span><span class="u">min</span></div>
          <div class="meter"><b style="--w:62%"></b></div>
        </div>

        <div class="cell void">
          <div class="label"><span class="dot off"></span>retention d30</div>
          <div class="val">--</div>
          <div class="dash"></div>
        </div>

        <div class="cell">
          <div class="label"><span class="dot on"></span>crash-free rate</div>
          <div class="val"><span class="n" data-to="99.2" data-dec="1"></span><span class="u">%</span></div>
          <div class="meter"><b style="--w:99.2%"></b></div>
        </div>

        <div class="cell void">
          <div class="label"><span class="dot off"></span>paid conversions</div>
          <div class="val">--</div>
          <div class="dash"></div>
        </div>

        <div class="cell">
          <div class="label"><span class="dot on"></span>support tickets</div>
          <div class="val"><span class="n" data-to="37" data-dec="0"></span></div>
          <div class="meter"><b style="--w:37%"></b></div>
        </div>

        <div class="cell void">
          <div class="label"><span class="dot off"></span>nps</div>
          <div class="val">--</div>
          <div class="dash"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var W = 1600, H = 900, BG = "#08090a";
  var c = document.getElementById("field");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = W * dpr; c.height = H * dpr;
  var g = c.getContext("2d");
  g.scale(dpr, dpr);

  // drifting dust
  var dust = [];
  for (var i = 0; i < 80; i++) {
    dust.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.1 + 0.25,
      vy: -(Math.random() * 0.14 + 0.035),
      vx: (Math.random() - 0.5) * 0.06,
      a: Math.random() * 0.28 + 0.05
    });
  }

  var TOP = 118, GAP = 13.4, N = 27, STEP = 7;

  function ridge(t) {
    for (var i = 0; i < N; i++) {
      var y0 = TOP + i * GAP;
      var depth = i / (N - 1);
      var band = 0.30 + 0.70 * Math.sin(Math.PI * (i + 0.7) / N);
      g.beginPath();
      for (var x = -STEP; x <= W + STEP; x += STEP) {
        var nx = x / W;
        var env = Math.exp(-Math.pow((nx - 0.66) / 0.29, 2));
        var amp = 74 * env * band;
        var wave =
          Math.sin(nx * 7.6 + t * 0.55 + i * 0.27) * 0.58 +
          Math.sin(nx * 3.2 - t * 0.34 + i * 0.16) * 0.30 +
          Math.sin(nx * 13.1 + t * 0.83 - i * 0.09) * 0.12;
        var y = y0 - amp * wave;
        if (x <= -STEP) g.moveTo(x, y); else g.lineTo(x, y);
      }
      // occlude everything behind this line
      g.lineTo(W + STEP, y0 + GAP * 3);
      g.lineTo(-STEP, y0 + GAP * 3);
      g.closePath();
      g.fillStyle = BG;
      g.fill();
      g.strokeStyle = "rgba(242,242,240," + (0.055 + 0.42 * depth).toFixed(3) + ")";
      g.lineWidth = 1;
      g.stroke();
    }
  }

  function frame(ms) {
    var t = ms / 1000;
    g.fillStyle = BG;
    g.fillRect(0, 0, W, H);

    // dust
    for (var i = 0; i < dust.length; i++) {
      var p = dust[i];
      p.y += p.vy; p.x += p.vx;
      if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      if (p.x < -4) p.x = W + 4; else if (p.x > W + 4) p.x = -4;
      g.beginPath();
      g.arc(p.x, p.y, p.r, 0, 6.2832);
      g.fillStyle = "rgba(242,242,240," + (p.a * (0.55 + 0.45 * Math.sin(t * 0.7 + i))).toFixed(3) + ")";
      g.fill();
    }

    ridge(t);

    // fade the ridge out beneath the headline so type and object read as one composition
    var lg = g.createLinearGradient(0, 0, 860, 0);
    lg.addColorStop(0, "rgba(8,9,10,1)");
    lg.addColorStop(0.55, "rgba(8,9,10,0.92)");
    lg.addColorStop(1, "rgba(8,9,10,0)");
    g.fillStyle = lg;
    g.fillRect(0, 0, 860, 500);

    // slow breathing vignette
    var v = g.createRadialGradient(1080, 300, 60, 1080, 300, 1180);
    v.addColorStop(0, "rgba(242,242,240," + (0.020 + 0.014 * Math.sin(t * 0.42)).toFixed(4) + ")");
    v.addColorStop(1, "rgba(8,9,10,0)");
    g.fillStyle = v;
    g.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // count-up on the four metrics that actually have data
  var nodes = document.querySelectorAll(".n");
  var t0 = null, DUR = 1500;
  function ease(x){ return 1 - Math.pow(1 - x, 4); }
  function count(ms) {
    if (t0 === null) t0 = ms;
    var k = Math.min((ms - t0) / DUR, 1), e = ease(k);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var to = parseFloat(n.getAttribute("data-to"));
      var dec = parseInt(n.getAttribute("data-dec"), 10);
      var v = to * e;
      n.textContent = dec ? v.toFixed(dec) : Math.round(v).toLocaleString("en-US");
    }
    if (k < 1) requestAnimationFrame(count);
  }
  requestAnimationFrame(count);

  var clock = document.getElementById("clock");
  function tick() {
    var d = new Date();
    var p = function(x){ return String(x).padStart(2, "0"); };
    clock.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
