name: publish

# Uploads a tagged release to PyPI with trusted publishing (OIDC), so no API
# token exists anywhere: PyPI trusts this workflow, in this repository, in the
# `pypi` environment, and nothing else. Registered once on pypi.org under
# emulo > Settings > Publishing.
#
# Runs when a GitHub release is published, or by hand for a tag that was
# released before this workflow existed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.6.3"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Refuse a tag that does not match the version it ships
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(python -c "import emulo; print(emulo.EMULO_VERSION)")
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} ships version ${version}"; exit 1; }
      - run: python -m pip install build==1.2.2 twine==6.1.0
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emulo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
