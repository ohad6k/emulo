name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml promises requires-python >=3.8. For six weeks the code broke that
        # promise in three places (dict | merges, 3.9+ syntax) and CI could not see it,
        # because it tested only 3.12. An outside contributor found it by reading (PR #44).
        # Test the floor and the ceiling: if code runs on both, the versions between almost
        # never break, and two lanes keep the matrix cheap.
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The bootstrap pin test reads the bytes at the pinned release tag.
          # Without full history and tags it cannot resolve them and skips,
          # which would silently retire the check that guards every install.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # The lock pins the [pro] extra, and cryptography's own floor is 3.9. The 3.8 lane
      # deliberately installs nothing: the core is dependency-free and the suite must pass
      # for a user who installed exactly that. Continuity tests skip themselves when the
      # extra is absent.
      - if: matrix.python-version != '3.8'
        run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
