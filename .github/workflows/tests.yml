name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The bootstrap pin test reads the bytes at the pinned release tag.
          # Without full history and tags it cannot resolve them and skips,
          # which would silently retire the check that guards every install.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v

  # The pages under site/ ship to production and had no automated coverage at all: scan.test.cjs
  # existed but no workflow ran it, and it only executed the page's logic sandbox. A button that
  # did nothing shipped past eight green tests. This job runs the page for real in jsdom.
  site-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
